Global:
  model_name: PP-OCRv6_small_rec_indic
  debug: false
  use_gpu: true
  epoch_num: 20
  log_smooth_window: 20
  print_batch_step: 50
  save_model_dir: /root/rec/output/indic_rec
  save_epoch_step: 2
  eval_batch_step: [0, 1000]
  cal_metric_during_train: true
  # Fine-tune from v6 small; the focused dict changes the head shape, so the CTC
  # and NRTR heads reinit while the PPLCNetV4 backbone + lightsvtr neck transfer.
  pretrained_model: /root/rec/pretrain/PP-OCRv6_small_rec_pretrained
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  character_dict_path: /root/rec/indic_latin_dict.txt
  max_text_length: &max_text_length 25
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: /root/rec/output/predicts_indic.txt
  d2s_train_image_shape: [3, 48, 320]
  # Mixed precision for the next round (bf16 is native on Blackwell / 50-series).
  # bf16 keeps fp32 exponent range, so no loss scaling is needed. The first run
  # trained fp32; this ~1.5-2x's the attention-heavy LightSVTR + NRTR heads.
  use_amp: true
  amp_level: O2
  amp_dtype: bfloat16
  scale_loss: 1.0
  use_dynamic_loss_scaling: false


Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0003
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05


Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV4
    model_size: small
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: lightsvtr
            dims: 120
            depth: 2
            mlp_ratio: 2.0
            local_kernel: 7
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: /dev/shm/indic
    ext_op_transform_idx: 1
    label_file_list:
    - /dev/shm/indic/train_list.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.5
        ext_data_num: 0
        image_shape: [48, 320, 3]
        max_text_length: *max_text_length
    - RecAug:
        # tia (MLS text-distortion) warp is pure-Python per-pixel and ate ~85% of
        # dataloader CPU; geometry comes from the generator's cheap cv2 warp
        # (synth_core.warp_maps, shared via recgen), so disable it here.
        tia_prob: 0.0
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: &bs 256
    fix_bs: false
    divided_factor: [8, 16]
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 12

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /dev/shm/indic
    label_file_list:
    - /dev/shm/indic/val_list.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 256
    num_workers: 8
