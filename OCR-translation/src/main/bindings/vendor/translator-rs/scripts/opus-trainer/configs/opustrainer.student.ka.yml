# OpusTrainer input-augmentation config for the base-memory student, flattened
# from mozilla/translations pipeline/train/configs/opustrainer/student.yml.
#
# Mozilla groups modifiers as common / bicameral_src / phonemic_src and applies a
# group only if the source script qualifies. Our pairs (en<->tl) are both Latin =
# bicameral AND phonemic, so all three groups apply; the list below is the union,
# ordered per mozilla's modifier_order (UpperCase, TitleCase, RemoveEndPunct,
# Typos, Noise). These teach the student to survive messy/casual/OOD input
# (wrong case, typos, dropped end punctuation) — the "brittle on hard text"
# failure that clean training data alone doesn't fix.
#
# The "Tags" modifier is intentionally dropped: it is inline-tag/terminology
# passthrough (needs PyICU + an SPM-level alignment remap), orthogonal to input
# robustness. Add it back if we want terminology copying.
#
# __TSV__ is substituted with the 3-col train TSV path by train_student.sh.
#
# GEORGIAN VARIANT. UpperCase is 0 here, not 0.07. Mkhedruli is unicameral and
# `.upper()` maps it into the separate Mtavruli block U+1C90-1CBF, which the
# joint SPM never saw because web Georgian is ~100% Mkhedruli. Perturbing 7% of
# lines into Mtavruli would byte-fallback them at roughly three pieces per
# character, and check_vocab.py cannot see it: it inspects the pool, not the
# augmented stream. Mtavruli is handled by normalizing at the MT input instead.
#
# TitleCase is 0.0 TOO, and the reason is a trap worth stating. Python's
# `.title()` IS a no-op on Mkhedruli, so title-casing looks safe. OpusTrainer
# does not call it: TitleCaseModifier does `word[0].upper() + word[1:]`, and
# `.upper()` DOES map Mkhedruli into Mtavruli. Leaving it at 0.05 put Mtavruli
# initials on 5% of training lines, and the first student trained that way
# emitted "Არ Არის Პარკინგი" on 6% of signs and 7.3% of UI strings -- Title Case
# does not exist in Georgian orthography at all. Verify the modifier's source,
# not the stdlib function that shares its name.
datasets:
  original: __TSV__

stages:
  - train

train:
  - original 1.0
  - until original inf   # stream forever; marian stops on early-stopping

seed: 1111

# src \t trg \t pharaoh-alignments (guided-alignment). Modifiers keep the
# alignment column consistent as they perturb src/trg.
num_fields: 3

modifiers:
  - UpperCase: 0.0
  - TitleCase: 0.0
  - RemoveEndPunct: 0.2
  - Typos: 0.05
  - Noise: 0.0005
    min_word_length: 2
    max_word_length: 5
    max_words: 6
